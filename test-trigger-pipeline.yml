trigger: none
pr:      none

pool:
  vmImage: 'ubuntu-latest'

variables:
  WEB_SERVICE_URL: 'https://playwright-testrunner.services-internal.wisework.in/tests/run/pipeline'

stages:
  - stage: TriggerMigrateTestsWebService
    displayName: 'Trigger Migrate E2E test api runner'
    jobs:
      - job: HitAndExit
        displayName: 'Send POST request to api to trigger the tests'
        steps:
          - task: Bash@3
            displayName: 'Collect PR info and POST to VM'
            inputs:
              targetType: 'inline'
              script: |
                # ── Guard: skip if no PR context (e.g. manual run) ──────────────
                PR_ID="$(System.PullRequest.PullRequestId)"

                if [[ -z "$PR_ID" ]]; then
                  echo "##vso[task.logissue type=warning]No PR context found — pipeline was triggered manually or without a PR."
                  echo "Skipping POST request. Exiting gracefully."
                  exit 0
                fi
                # ─────────────────────────────────────────────────────────────────

                PAYLOAD=$(cat <<EOF
                {
                  "category": "Smoke",
                  "upload_after": true,
                  "metadata": {
                    "orgUrl": "$(System.TeamFoundationCollectionUri)",
                    "projectName": "$(System.TeamProject)",
                    "repoId": "$(Build.Repository.ID)",
                    "commitSha": "$(Build.SourceVersion)",
                    "buildId": "$(Build.BuildId)",
                    "buildNumber": "$(Build.BuildNumber)",
                    "prId": "$(System.PullRequest.PullRequestId)",
                    "sourceBranch": "$(System.PullRequest.SourceBranch)",
                    "targetBranch": "$(System.PullRequest.TargetBranch)"
                  }
                }
                EOF
                )

                echo "==== PAYLOAD ===="
                echo "$PAYLOAD"
                echo "================="

                RESPONSE=$(curl --silent --show-error --max-time 30 \
                  -w "\nHTTP_STATUS:%{http_code}" \
                  -X POST \
                  -H "Content-Type: application/json" \
                  -d "$PAYLOAD" \
                  "$(WEB_SERVICE_URL)")

                HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | sed 's/HTTP_STATUS://')
                echo "VM responded: HTTP $HTTP_STATUS"

                if [[ "$HTTP_STATUS" != "200" && "$HTTP_STATUS" != "202" ]]; then
                  echo "##vso[task.logissue type=error]VM did not acknowledge. HTTP: $HTTP_STATUS"
                  exit 1
                fi

                echo "VM acknowledged — pipeline exits."