trigger:
  branches:
    include:
      - main

variables:
  testCategory: 'Smoke'


jobs:
- job: BuildAndTest_WiseMigrate
  displayName: "Build and Run Tests in WiseMigrate"
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  # 1. Checkout the test repo (explicit is better)
  - checkout: self
    displayName: "Checkout Test Repository"

  # 2. Install .NET SDK
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.0.x'
    displayName: "Install .NET 8 SDK"
    
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.0.x'
    displayName: "Install .NET 9 SDK"

  # 3. Restore dependencies
  - script: dotnet restore
    workingDirectory: $(Build.SourcesDirectory)
    displayName: "Restore NuGet Packages"

  # 4. Build solution
  - script: dotnet build --configuration Release --no-restore
    workingDirectory: $(Build.SourcesDirectory)
    displayName: "Build Solution"
  
  - script: |
      PLAYWRIGHT_SCRIPT=$(find $(Build.SourcesDirectory) -name "playwright.ps1" \
        -path "*/bin/Release/*" | head -1)
        
      if [ -z "$PLAYWRIGHT_SCRIPT" ]; then
        echo "playwright.ps1 not found!"
        exit 1
      fi
      
      echo "Found: $PLAYWRIGHT_SCRIPT"
      pwsh "$PLAYWRIGHT_SCRIPT" install chromium --with-deps
    displayName: "Install Playwright Chromium"

  # 5. Run Tests
  - script: >
      dotnet test
      --configuration Release
      --no-build
      --filter "Category=$(testCategory)"
      --logger "trx;LogFileName=results.trx"
      --results-directory $(Build.ArtifactStagingDirectory)/TestResults
    workingDirectory: $(Build.SourcesDirectory)
    displayName: "Run Tests"
    continueOnError: true

  - script: |
      echo "=== Failed Tests ==="
      grep -A 15 'outcome="Failed"' $(Build.ArtifactStagingDirectory)/TestResults/results.trx || echo "No TRX found or no failures"
    condition: always()
    displayName: "Print Failed Test Details"

  # 6. Publish Test Results — always runs even if tests fail
  - task: PublishTestResults@2
    condition: always()                            
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Build.ArtifactStagingDirectory)/TestResults' 
      failTaskOnFailedTests: true
      testRunTitle: 'Test Run - $(Build.BuildNumber)'  
    displayName: "Publish Test Results"